<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d7cff" />
  <title>فعالیت کلاسی زبان‌آموزان</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <!-- استایل و اسکریپت دیت‌پیکر شمسی سبک -->
  <link rel="stylesheet" href="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.css">
  <script src="https://unpkg.com/@majidh1/jalalidatepicker/dist/jalalidatepicker.min.js"></script>

</head>

<body>

  <div class="app">
    <!-- ======================================================== -->
    <!-- #region بخش هدر مشترک تمام صفحات -->

    <div id="menuDrawer" class="drawer">
      <!-- لوگوی پس‌زمینه -->
      <div class="bg-logo">
        <img src="img/logo.png" alt="Logo">
      </div>

      <h2>منوی اصلی</h2>

      <ul>
        <li><button class="tab active" data-page="page-classes" type="button">کلاس‌ها</button></li>
        <li><button class="tab" data-page="page-students" type="button">زبان‌آموزان</button></li>
        <li><button class="tab" data-page="page-daily" type="button">نمرات روزانه</button></li>
        <li><button class="tab" data-page="page-report-cards" type="button">کارنامه‌ها</button></li>
        <li><button class="tab" data-page="page-export" type="button">خروجی</button></li>
      </ul>
    </div>


    <!-- پرده سیاه پشت مودال ها و منو-->
    <div id="modalOverlay" class="overlay" style="display:none;"></div>

    <!-- فقط یک هدر مشترک برای کل اپلیکیشن -->
    <header>
      <button id="menuBtn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
      </button>
      <h3 id="pageTitle">معلم یار دماوند</h3>
      <div class="pill">
        <span class="dot"></span>
        <!-- متن داخل تگ زیر توسط فایل app-store مدیریت میشود -->
        <span id="saveStateText"></span>   
      </div>
    </header>

    <!-- #endregion -->
    <!-- ======================================================== -->


    <!-- ======================================================== -->
    <!-- #region صفحه کلاس ها -->

    <section class="page active" id="page-classes">
      <div class="card">
        <div class="hd">
          <h2>مدیریت کلاس</h2>
          <span id="classesCount" style="color:var(--muted); font-size:12px; font-weight:900;"></span>
        </div>
        <div class="bd">
          <div class="row">
            <div class="w100">
              <label>انتخاب کلاس</label>
              <select id="classSelect"></select>
            </div>
            <button class="btn primary" type="button" onclick="showAddClassModal()">کلاس جدید</button>
            <button class="btn" type="button" onclick="openRenameClassModal()">تغییر نام</button>
            <button class="btn pink" id="btnDeleteClass" type="button">حذف</button>
          </div>

          <div style="height:12px;"></div>

          <div class="row">
            <div>
              <label>روز هفته</label>
              <select id="daySelect">
                <option value="شنبه">شنبه</option>
                <option value="یکشنبه">یکشنبه</option>
                <option value="دوشنبه">دوشنبه</option>
                <option value="سه‌شنبه">سه‌شنبه</option>
                <option value="چهارشنبه">چهارشنبه</option>
                <option value="پنجشنبه">پنجشنبه</option>
                <option value="جمعه">جمعه</option>
              </select>
            </div>


            <div class="tiny">
              <label>جلسه</label>
              <input id="sessionNoInput" type="text" inputmode="numeric">
            </div>


            <div style="display: flex; flex-direction: column; gap: 10px;">

              <label>تاریخ (شمسی)</label>
              <input id="dateInput" type="text" data-jdp readonly placeholder="انتخاب تاریخ...">

              <button type="button" class="btn pink" onclick="openDailyHistoryModal()">
              تاریخچه
              </button>

            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- #endregion -->
    <!-- ======================================================== -->

    <!-- ======================================================== -->
    <!-- #region صفحه زبان‌آموزان -->
    <section class="page" id="page-students">
      <div class="card">
        <div class="hd">
          <h2>مدیریت اسامی زبان‌آموزان</h2>
          <span id="studentsCount" style="color:var(--muted); font-size:12px; font-weight:900;"></span>
        </div>
        <div class="bd">
          <div class="row">
            <div class="w100">
              <input id="newStudentName" type="text" placeholder="نام و نام خانوادگی زبان‌آموز..." autocomplete="off">
            </div>
            <button class="btn primary" id="btnAddStudent" type="button">افزودن نام</button>
          </div>

          <div style="height:14px;"></div>

          <div id="studentsEmpty" style="display:none; text-align:center; padding: 20px; color: var(--muted);">
            هنوز زبان‌آموزی در این کلاس ثبت نشده است.
          </div>

          <div id="studentsManageList" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>

        <!-- دکمه‌های عملیات پایین صفحه نمرات روزانه -->
        <div style="display:flex; gap:8px; margin-top:16px;">
          <button type="button" class="btn primary" style="flex:2; min-height:42px;" onclick="saveDailySession(true)">
            💾 ذخیره جلسه امروز
          </button>
          <button type="button" class="btn" style="flex:1; min-height:42px; background:#f1f5f9;"
            onclick="openDailyHistoryModal()">
            📜 تاریخچه
          </button>
        </div>
      </div>
    </section>
    <!-- #endregion -->
    <!-- ======================================================== -->


    <!-- ======================================================== -->
    <!-- #region صفحه نمرات روزانه -->
    <section class="page" id="page-daily">

      <!-- سوییچ بین دو حالت ثبت روزانه -->
      <div class="card" style="margin-bottom: 12px; padding: 10px;">
        <div style="display: flex; gap: 8px;">

          <button type="button" class="btn primary" id="btnDailyModeStudent" style="flex:1; min-height:40px;"
            onclick="switchDailyMode('student')">👤 بر اساس زبان‌آموز</button>

          <button type="button" class="btn" id="btnDailyModeField"
            style="flex:1; min-height:40px; background:#e2e8f0; color:#1e293b;" onclick="switchDailyMode('field')">📊
            ثبت یک آیتم برای همه</button>

        </div>
      </div>

      <div class="card">
        <div class="hd">
          <h2>نمرات کلاسی و روزانه</h2>
          <span style="font-size:12px; color:var(--muted);" id="dailyActiveClassName"></span>
        </div>

        <div class="bd">
          <!-- حالت ۱ روزانه: بر اساس زبان‌آموز -->
          <div id="dailyStudentContainer">
            <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 14px;">

              <button type="button" class="btn" style="min-height:38px; padding:6px 14px;"
                onclick="navDailyStudent(-1)">▶</button>

              <select id="dailyStudentSelect" class="dropdown-select" style="flex:1; font-weight:bold; height:38px;"
                onchange="renderDailyStudentView()"></select>

              <button type="button" class="btn" style="min-height:38px; padding:6px 14px;"
                onclick="navDailyStudent(1)">◀</button>

            </div>

            <div id="dailyStudentFormList"></div>

            <div
              style="display:flex; justify-content:space-between; align-items:center; background:#f1f5f9; padding:10px; border-radius:8px; margin-top:12px;">
              <span style="font-weight:bold; font-size:14px;">مجموع نمره روزانه:</span>
              <span id="dailyCurrentTotal" style="font-weight:900; color:#0284c7; font-size:16px;">۰ / ۴۰</span>
            </div>

          </div>

          <!-- حالت ۲ روزانه: بر اساس یک آیتم برای کل کلاس -->
          <div id="dailyFieldContainer" style="display: none;">
            <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 14px;">
              <button type="button" class="btn" style="min-height:38px; padding:6px 14px;"
                onclick="navDailyField(-1)">▶</button>

              <select id="dailyFieldSelect" class="dropdown-select" style="flex:1; font-weight:bold; height:38px;"
                onchange="renderDailyFieldView()"></select>

              <button type="button" class="btn" style="min-height:38px; padding:6px 14px;"
                onclick="navDailyField(1)">◀</button>
            </div>

            <div id="dailyFieldFormList"></div>
          </div>
        </div>
      </div>
    </section>
    <!-- #endregion -->
    <!-- ======================================================== -->


    <!-- ======================================= -->
    <!-- #region مودال تاریخچه نمرات روزانه -->
    <div id="dailyHistoryModal" class="modal">
      <div class="hd"
        style="display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid #e2e8f0;">
        <h3 style="margin:0; font-size:16px;">تاریخچه نمرات ثبت‌شده</h3>
      </div>
      <div id="dailyHistoryList" style="padding:14px; overflow-y:auto; flex:1;">
        <!-- لیست جلسات قبلی اینجا لود میشه -->
      </div>
    </div>
    <!-- #endregion -->
    <!-- ======================================= -->


    <!-- #endregion -->
    <!-- ======================================================== -->



    <!-- ======================================================== -->
    <!-- #region صفحه ثبت نمرات کارنامه -->
    <section class="page" id="page-report-cards">
      <!-- سوییچ بین دو حالت ثبت -->
      <div class="card" style="margin-bottom: 12px; padding: 10px;">
        <div style="display: flex; gap: 8px;">
          <button type="button" class="btn primary" id="btnRcModeStudent" style="flex:1; min-height:42px;"
            onclick="switchRcMode('student')">👤 بر اساس زبان‌آموز</button>
          <button type="button" class="btn" id="btnRcModeField"
            style="flex:1; min-height:42px; background:#e2e8f0; color:#1e293b;" onclick="switchRcMode('field')">📊 ثبت
            یک آیتم برای همه</button>
        </div>
      </div>

      <div class="card">
        <div class="hd">
          <h2 id="rcPageTitle">ثبت نمرات کارنامه نهایی</h2>
          <span style="font-size:12px; color:var(--muted);" id="rcActiveClassName"></span>
        </div>

        <div class="bd">
          <!-- حالت اول: بر اساس تک زبان‌آموز -->
          <div id="rcStudentContainer">
            <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 14px;">
              <button type="button" class="btn" style="min-height:38px; padding:6px 14px;"
                onclick="navRcStudent(-1)">▶</button>
              <select id="rcStudentSelect" class="dropdown-select" style="flex:1; font-weight:bold; height:38px;"
                onchange="renderRcStudentView()"></select>
              <button type="button" class="btn" style="min-height:38px; padding:6px 14px;"
                onclick="navRcStudent(1)">◀</button>
            </div>

            <div id="rcStudentFormList"></div>

            <div
              style="display:flex; justify-content:space-between; align-items:center; background:#f1f5f9; padding:10px; border-radius:8px; margin-top:10px;">
              <span style="font-weight:bold; font-size:14px;">مجموع نمرات:</span>
              <span id="rcCurrentTotal" style="font-weight:900; color:#16a34a; font-size:16px;">0</span>
            </div>

            <button type="button" class="btn" id="btnCopyRcString"
              style="width:100%; margin-top:14px; background:#16a34a; color:#fff; font-weight:bold; min-height:46px; font-size:14px;"
              onclick="copyRcString(this)">
              📋 کپی رشته پیست کارنامه
            </button>
          </div>

          <!-- حالت دوم: بر اساس یک آیتم برای کل کلاس -->
          <div id="rcFieldContainer" style="display: none;">
            <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 14px;">
              <button type="button" class="btn" style="min-height:38px; padding:6px 14px;"
                onclick="navRcField(-1)">▶</button>
              <select id="rcFieldSelect" class="dropdown-select" style="flex:1; font-weight:bold; height:38px;"
                onchange="renderRcFieldView()"></select>
              <button type="button" class="btn" style="min-height:38px; padding:6px 14px;"
                onclick="navRcField(1)">◀</button>
            </div>

            <div id="rcFieldFormList"></div>
          </div>
        </div>
      </div>
    </section>
    <!-- #endregion -->
    <!-- ======================================================== -->

    <!-- ======================================================== -->
    <!-- #region صفحه خروجی -->
    <section class="page" id="page-export">
      <div class="card">
        <div class="hd">
          <h2>دریافت خروجی</h2>
        </div>
        <div class="bd">
          <div class="row">
            <button class="btn primary w100" id="btnExportPng" type="button">گرفتن خروجی PNG (تصویر)</button>
            <button class="btn ghost" id="btnBackup" type="button">پشتیبان JSON</button>
            <button class="btn ghost" id="btnRestore" type="button">بازیابی فایل</button>
            <button class="btn pink" id="btnWipe" type="button">حذف همه داده‌ها</button>
            <button class="btn" onclick="exportClassReportCardsTxt()"
              style="background:#0284c7; color:#fff; margin-top:10px;">📥 دانلود فایل TXT کارنامه‌های کل کلاس</button>
          </div>
        </div>
      </div>
    </section>

    <div class="bottom-bar">
      <div class="bottom-actions">
        <button class="btn primary" id="quickStudents" type="button">ثبت نمرات</button>
        <button class="btn pink" id="quickExport" type="button">خروجی</button>
      </div>
    </div>
    <!-- #endregion -->
    <!-- ======================================================== -->

  </div>

  <div class="toast" id="toast">
    <div>
      <span id="toastMsg"></span>
      <button class="x" id="toastX" type="button">✕</button>
    </div>
  </div>

  <input type="file" id="restoreFile" accept=".json" style="display:none;" />
  <div class="export-stage" id="exportStage" aria-hidden="true"></div>


  <!-- ======================================================== -->
  <!-- #region لود کردن فایل های جاوا اسکریپت -->

  <script src="./html2canvas.min.js"></script>
  <script src="js/00_app-store.js"></script>
  <script src="js/00_general.js"></script>
  <script src="js/00.5_modals.js"></script>
  <script src="js/01_menu-drawer.js"></script>
  <script src="js/02_nav-pages.js"></script>
  <script src="js/03_classes.js"></script>
  <script src="js/04_students.js"></script>
  <script src="js/05_dailt-grades.js"></script>
  <script src="js/05.5_daily-history-modal.js"></script>
  <script src="js/05.6_add-classes-modal.js"></script>
  <script src="js/05.7_edit-classes-modal.js"></script>
  <script src="js/06_report-cards.js"></script>
  <script src="js/07_table-image-output.js"></script>
  <script src="js/08_data-backup-restore-cleanup.js"></script>
  <script src="js/09_solar-calendar.js"></script>

  <!-- #endregion -->
  <!-- ======================================================== -->
  <script>
    // [استارت نهایی سیستم]
    AppStore.load();
    autoSetToday();
    renderClasses();
    renderStudentsManage?.();
  </script>
</body>
</html>
