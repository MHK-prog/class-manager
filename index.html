<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d7cff" />
  <title>فعالیت کلاسی زبان‌آموزان</title>

  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #f7fbff;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #5b6b82;
      --line: rgba(15, 23, 42, 0.10);

      --blue: #2d7cff;
      --blue2: #1aa6ff;
      --pink: #ff4da6;
      --pink2: #ff7bc3;

      --shadow: 0 10px 24px rgba(15, 23, 42, 0.10);
      --r: 16px;
      --r2: 12px;
      --focus: 0 0 0 4px rgba(45, 124, 255, 0.18);

      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(900px 600px at 80% -10%, rgba(255, 77, 166, 0.18), transparent 60%),
        radial-gradient(900px 600px at 10% -10%, rgba(45, 124, 255, 0.18), transparent 60%),
        var(--bg);
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 12px calc(80px + env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 2px 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .brand .sub {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      user-select: none;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--blue);
      box-shadow: 0 0 0 4px rgba(45, 124, 255, 0.14);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card .hd {
      padding: 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card .hd h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
    }

    .card .bd {
      padding: 12px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .row>* {
      flex: 1 1 160px;
    }

    .row .w100 {
      flex: 1 1 100%;
    }

    .row .tiny {
      flex: 1 1 90px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(15, 23, 42, 0.14);
      background: #fff;
      outline: none;
      color: var(--text);
      font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      box-shadow: var(--focus);
      border-color: rgba(45, 124, 255, 0.55);
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      min-height: 48px;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      color: #fff;
    }

    .btn.pink {
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color: #fff;
    }

    .btn.ghost {
      background: #fff;
      border: 1px solid rgba(15, 23, 42, 0.14);
      color: var(--text);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 10px 0 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid rgba(15, 23, 42, 0.14);
      background: #fff;
      padding: 10px 16px;
      font-weight: 900;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--blue), var(--pink));
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* Column Selector for Quick Score Entry */
    .col-filter-wrap {
      margin-bottom: 12px;
      background: #eff6ff;
      border: 1px solid rgba(45, 124, 255, 0.18);
      border-radius: 14px;
      padding: 10px;
    }

    .col-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .col-pills::-webkit-scrollbar {
      display: none;
    }

    .pill-btn {
      border: 1px solid rgba(45, 124, 255, 0.2);
      background: #fff;
      color: #1e3a8a;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .pill-btn.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    /* Student Cards */
    .students {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .student-card {
      border: 1px solid rgba(15, 23, 42, 0.10);
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .student-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
    }

    .student-top .st-name {
      font-weight: 900;
      font-size: 14px;
      color: var(--text);
    }

    .student-top .total {
      font-weight: 900;
      color: #0b3a92;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(45, 124, 255, 0.10);
      direction: ltr;
    }

    .student-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .grid-scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .grid-scores.single-col {
      grid-template-columns: 1fr;
    }

    .score-input-box {
      display: flex;
      flex-direction: column;
    }

    .score-input-box.highlight {
      background: #f0fdf4;
      padding: 10px;
      border-radius: 12px;
      border: 1.5px solid #4ade80;
    }

    .num {
      direction: ltr;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
    }

    .single-mode-input {
      font-size: 22px !important;
      height: 52px;
      text-align: center;
      font-weight: 900;
      color: #1e40af;
      border: 2px solid var(--blue) !important;
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(15, 23, 42, 0.10);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
    }

    .bottom-actions {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(70px + env(safe-area-inset-bottom));
      display: none;
      justify-content: center;
      z-index: 70;
    }

    .toast>div {
      width: min(980px, 100%);
      background: #1e293b;
      color: #fff;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    .toast .x {
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    /* Export Stage */
    .export-stage {
      position: fixed;
      left: -99999px;
      top: 0;
      width: 950px;
      background: #ffffff;
      color: #111827;
      direction: rtl;
      padding: 20px;
      font-family: var(--font);
    }

    .export-title {
      text-align: center;
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .export-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .export-meta .item {
      border: 1px solid #e5e7eb;
      padding: 8px 10px;
      border-radius: 8px;
      background: #f9fafb;
    }

    .export-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    .export-table th,
    .export-table td {
      border: 1px solid #d1d5db;
      padding: 6px 4px;
      text-align: center;
    }

    .export-table th {
      background: #eff6ff;
      font-weight: 900;
    }

    .export-table td.name {
      text-align: right;
      padding-inline: 6px;
    }

    @media (min-width: 768px) {
      .bottom-bar {
        position: static;
        background: transparent;
        border: 0;
        padding: 0;
      }

      .grid-scores {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* پرده شفاف/تیره پشت */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      z-index: 99;
    }

    /* باکس مودال وسط صفحه */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 90%;
      max-width: 350px;
    }

    .dropdown-select {
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      background-color: #fff;
      color: #334155;
      cursor: pointer;
      outline: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .dropdown-select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
    }
  </style>
</head>

<body>

  <div class="app">
    <!-- ======================================================== -->
    <!-- #region بخش هدر مشترک تمام صفحات -->
    <header>
      <div class="brand">
        <h1>فعالیت کلاسی</h1>
        <p class="sub" id="headSub"></p>
      </div>
      <div class="pill">
        <span class="dot"></span>
        <span id="saveStateText">ذخیره خودکار</span>
      </div>
    </header>


    <nav class="tabs" aria-label="صفحات">
      <button class="tab active" data-page="page-classes" type="button">کلاس‌ها</button>
      <button class="tab" data-page="page-students" type="button">زبان‌آموزان</button>
      <button class="tab" data-page="page-export" type="button">خروجی</button>
    </nav>
    <!-- #endregion -->
    <!-- ======================================================== -->


    <!-- ======================================================== -->
    <!-- #region صفحه کلاس ها -->

    <section class="page active" id="page-classes">
      <div class="card">
        <div class="hd">
          <h2>مدیریت کلاس</h2>
          <span id="classesCount" style="color:var(--muted); font-size:12px; font-weight:900;"></span>
        </div>
        <div class="bd">
          <div class="row">
            <div class="w100">
              <label>انتخاب کلاس</label>
              <select id="classSelect"></select>
            </div>
            <button class="btn primary" id="btnAddClass" type="button">کلاس جدید</button>
            <button class="btn ghost" id="btnRenameClass" type="button">تغییر نام</button>
            <button class="btn pink" id="btnDeleteClass" type="button">حذف</button>
          </div>

          <div style="height:12px;"></div>
          <!-- ================================================================= -->
          <!-- #region مودال اضافه کردن کلاس (صفحه شناور مخفی) -->

           <!-- پرده سیاه پشت مودال -->
          <div id="modalOverlay" class="overlay" style="display:none;"></div>

          <!-- خوده مودال -->
          <div id="addClassModal" class="modal" style="display:none;">
            <header>
              <h2>اضافه کردن کلاس جدید</h2>
            </header>
            <input type="text" id="modalClassNameInput" placeholder="نام کلاس...">
            <button type="button" class="btn primary" id="btnSubmitNewClass">ثبت کلاس</button>
          </div>
          <!-- #endregion -->
          <!-- ================================================================= -->


          <div class="row">
            <div>
              <label>روز هفته</label>
              <select id="daySelect">
                <option value="">انتخاب روز...</option>
                <option value="شنبه">شنبه</option>
                <option value="یکشنبه">یکشنبه</option>
                <option value="دوشنبه">دوشنبه</option>
                <option value="سه‌شنبه">سه‌شنبه</option>
                <option value="چهارشنبه">چهارشنبه</option>
                <option value="پنجشنبه">پنجشنبه</option>
                <option value="جمعه">جمعه</option>
              </select>
            </div>
            <div class="tiny">
              <label>جلسه</label>
              <input id="sessionNoInput" type="text" inputmode="numeric">
            </div>
            <div>
              <label>تاریخ (شمسی)</label>
              <input id="dateInput" type="text">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- #endregion -->
    <!-- ======================================================== -->

    <!-- ======================================================== -->
    <!-- #region صفحه زبان آموزان -->

    <section class="page" id="page-students">
      <div class="col-filter-wrap">
        <label style="color:#1e3a8a; font-weight:bold; margin-bottom:4px;">🎯 انتخاب بخش نمره‌دهی سریع:</label>
        <div class="col-pills" id="columnFilterPills">
          <button type="button" class="pill-btn active" data-col="all">نمایش همه ستون‌ها</button>
          <!-- ================================================================== -->
          <!-- #region دکمه فیلتر کردن سلول های نمره دهی -->
          <div class="filter-dropdown-wrapper">
            <select id="colFilterSelect" class="dropdown-select">
              <option value="all">🔍 نمایش همه ستون‌ها</option>
              <option value="name">ویرایش نام</option>
              <option value="attendance">حضور (۵)</option>
              <option value="homework">تکالیف (۱۰)</option>
              <option value="speaking">مکالمه (۵)</option>
              <option value="reading">روخوانی (۵)</option>
              <option value="grammar">گرامر (۵)</option>
              <option value="dictation">املا/انشا (۵)</option>
              <option value="discipline">انضباط (۵)</option>
              <option value="notes">توضیحات</option>
            </select>
          </div>
          <!-- #endregion -->
          <!-- ================================================================== -->

        </div>
      </div>

      <div class="card">
        <div class="hd">
          <h2>لیست زبان‌آموزان</h2>
          <span id="studentsCount" style="color:var(--muted); font-size:12px; font-weight:900;"></span>
        </div>
        <div class="bd">
          <div class="row">
            <div class="w100">
              <input id="newStudentName" type="text" placeholder="نام و نام خانوادگی زبان‌آموز..." autocomplete="off">
            </div>
            <button class="btn primary" id="btnAddStudent" type="button">افزودن نام</button>
          </div>

          <div style="height:12px;"></div>

          <div id="studentsEmpty" style="display:none; text-align:center; padding: 20px; color: var(--muted);">
            هنوز زبان‌آموزی در این کلاس ثبت نشده است.
          </div>

          <div class="students" id="studentsList"></div>
        </div>
      </div>
    </section>

    <!-- #endregion -->
    <!-- ======================================================== -->

    <!-- ======================================================== -->
    <!-- #region صفحه خروجی -->
    <section class="page" id="page-export">
      <div class="card">
        <div class="hd">
          <h2>دریافت خروجی</h2>
        </div>
        <div class="bd">
          <div class="row">
            <button class="btn primary w100" id="btnExportPng" type="button">گرفتن خروجی PNG (تصویر)</button>
            <button class="btn ghost" id="btnBackup" type="button">پشتیبان JSON</button>
            <button class="btn ghost" id="btnRestore" type="button">بازیابی فایل</button>
            <button class="btn pink" id="btnWipe" type="button">حذف همه داده‌ها</button>
          </div>
        </div>
      </div>
    </section>

    <div class="bottom-bar">
      <div class="bottom-actions">
        <button class="btn primary" id="quickStudents" type="button">ثبت نمرات</button>
        <button class="btn pink" id="quickExport" type="button">خروجی</button>
      </div>
    </div>
    <!-- #endregion -->
    <!-- ======================================================== -->

  </div>

  <div class="toast" id="toast">
    <div>
      <span id="toastMsg"></span>
      <button class="x" id="toastX" type="button">✕</button>
    </div>
  </div>

  <input type="file" id="restoreFile" accept=".json" style="display:none;" />
  <div class="export-stage" id="exportStage" aria-hidden="true"></div>


  <script src="./html2canvas.min.js"></script>

  <script>
    'use strict';

    // ========================================================
    // #region 1. Config & DOM Elements
    const STORAGE_KEY = 'offline_class_grades_v3';
    const SCORE_COLS = [
      { key: 'attendance', label: 'حضور و تأخیر', max: 5 },
      { key: 'homework', label: 'تکالیف', max: 10 },
      { key: 'speaking', label: 'مکالمه', max: 5 },
      { key: 'reading', label: 'روخوانی', max: 5 },
      { key: 'grammar', label: 'گرامر', max: 5 },
      { key: 'dictation', label: 'املا و انشا', max: 5 },
      { key: 'discipline', label: 'انضباط', max: 5 }
    ];
    const TOTAL_MAX = 40;

    let activeFilterCol = 'all';
    let state = null;

    const $ = (id) => document.getElementById(id);
    const el = {
      headSub: $('headSub'),
      saveStateText: $('saveStateText'),
      tabs: Array.from(document.querySelectorAll('.tab')),
      pages: Array.from(document.querySelectorAll('.page')),
      classSelect: $('classSelect'),
      btnAddClass: $('btnAddClass'),
      btnRenameClass: $('btnRenameClass'),
      btnDeleteClass: $('btnDeleteClass'),
      classesCount: $('classesCount'),
      daySelect: $('daySelect'),
      sessionNoInput: $('sessionNoInput'),
      dateInput: $('dateInput'),
      studentsCount: $('studentsCount'),
      newStudentName: $('newStudentName'),
      btnAddStudent: $('btnAddStudent'),
      studentsEmpty: $('studentsEmpty'),
      studentsList: $('studentsList'),
      btnExportPng: $('btnExportPng'),
      btnBackup: $('btnBackup'),
      btnRestore: $('btnRestore'),
      btnWipe: $('btnWipe'),
      quickStudents: $('quickStudents'),
      quickExport: $('quickExport'),
      toast: $('toast'),
      toastMsg: $('toastMsg'),
      toastX: $('toastX'),
      restoreFile: $('restoreFile'),
      exportStage: $('exportStage'),
      colFilterSelect: $('colFilterSelect'),
      modalOverlay: $('modalOverlay'),
      addClassModal: $('addClassModal'),
      modalClassNameInput: $('modalClassNameInput'),
      btnSubmitNewClass: $('btnSubmitNewClass')
    };
    // #endregion
    // ========================================================

    // ========================================================
    // #region 2. Helpers & Utilities
    function uid() {
      return 'id_' + Math.random().toString(16).slice(2) + '_' + Date.now().toString(16);
    }

    function normalizeNumber(str) {
      if (!str) return '';
      const map = {
        '۰': '0', '۱': '1', '۲': '2', '۳': '3', '۴': '4', '۵': '5', '۶': '6', '۷': '7', '۸': '8', '۹': '9',
        '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4', '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9',
        '٫': '.', '،': '.', ',': '.'
      };
      return String(str).replace(/[۰-۹٠-٩٫،,]/g, ch => map[ch] || ch).trim();
    }

    function computeTotal(scores) {
      let sum = 0;
      for (const c of SCORE_COLS) {
        const v = Number(scores?.[c.key]);
        if (Number.isFinite(v)) sum += v;
      }
      return Math.min(TOTAL_MAX, Math.max(0, Math.round(sum * 100) / 100));
    }

    function jalaliToday() {
      try {
        return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
          year: 'numeric', month: '2-digit', day: '2-digit'
        }).format(new Date());
      } catch (err) { return ''; }
    }

    function toast(msg) {
      el.toastMsg.textContent = msg;
      el.toast.style.display = 'flex';
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.toast.style.display = 'none'; }, 3000);
    }

    function openAddClassModal() {
      el.modalOverlay.style.display = 'block';
      el.addClassModal.style.display = 'flex';
      el.modalClassNameInput.value = '';
      el.modalClassNameInput.focus();
    }

    function closeAddClassModal() {
      el.modalOverlay.style.display = 'none';
      el.addClassModal.style.display = 'none';
    }
    // #endregion
    // ========================================================

    // ========================================================
    // #region 3. State Management
    function makeFreshState() {
      const firstId = uid();
      return {
        version: 3,
        selectedClassId: firstId,
        classes: [{
          id: firstId,
          name: 'کلاس ۱',
          session: { dayOfWeek: '', sessionNo: '1', dateJalali: jalaliToday() },
          students: []
        }]
      };
    }

    function sanitizeState(obj) {
      if (!obj || !Array.isArray(obj.classes) || !obj.classes.length) return makeFreshState();
      return obj;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state = raw ? sanitizeState(JSON.parse(raw)) : makeFreshState();
      } catch (err) {
        state = makeFreshState();
      }
      saveState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        el.saveStateText.textContent = 'ذخیره خودکار';
      } catch (err) {
        el.saveStateText.textContent = 'خطا در ذخیره';
      }
    }

    function getSelectedClass() {
      let cls = state.classes.find(c => c.id === state.selectedClassId);
      if (!cls && state.classes.length) {
        state.selectedClassId = state.classes[0].id;
        cls = state.classes[0];
      }
      return cls;
    }
    // #endregion
    // ========================================================

    // ========================================================
    // #region 4. UI Rendering
    function updateHeaderSub() {
      const cls = getSelectedClass();
      if (!cls) return;
      const parts = [
        cls.name,
        cls.session?.dayOfWeek,
        cls.session?.sessionNo ? `جلسه ${cls.session.sessionNo}` : '',
        cls.session?.dateJalali
      ].filter(Boolean);
      el.headSub.textContent = parts.join(' • ');
    }

    function showPage(pageId) {
      el.pages.forEach(p => p.classList.toggle('active', p.id === pageId));
      el.tabs.forEach(t => t.classList.toggle('active', t.dataset.page === pageId));
    }

    function renderClasses() {
      el.classesCount.textContent = state.classes.length + ' کلاس';
      el.classSelect.innerHTML = '';
      state.classes.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${i + 1} — ${c.name || 'کلاس'}`;
        if (c.id === state.selectedClassId) opt.selected = true;
        el.classSelect.appendChild(opt);
      });

      const cls = getSelectedClass();
      if (!cls) return;
      if (!cls.session) cls.session = {};
      el.daySelect.value = cls.session.dayOfWeek || '';
      el.sessionNoInput.value = cls.session.sessionNo || '';
      el.dateInput.value = cls.session.dateJalali || '';
      updateHeaderSub();
    }

    function renderStudents() {
      const cls = getSelectedClass();
      if (!cls) return;

      const students = cls.students || [];
      el.studentsCount.textContent = students.length + ' نفر';
      el.studentsEmpty.style.display = students.length ? 'none' : 'block';
      el.studentsList.innerHTML = '';

      students.forEach((st, idx) => {
        const card = document.createElement('div');
        card.className = 'student-card';

        const top = document.createElement('div');
        top.className = 'student-top';
        top.innerHTML = `
          <div>
            <span style="color:var(--muted); font-size:12px; margin-left:4px;">#${idx + 1}</span>
            <span class="st-name">${st.fullName || 'بدون نام'}</span>
          </div>
          <div class="total">${computeTotal(st.scores)} / ۴۰</div>
        `;
        card.appendChild(top);

        const body = document.createElement('div');
        body.className = 'student-body';

        const grid = document.createElement('div');
        grid.className = 'grid-scores' + (activeFilterCol !== 'all' ? ' single-col' : '');

        if (activeFilterCol === 'all' || activeFilterCol === 'name') {
          const nameWrap = document.createElement('div');
          nameWrap.style.gridColumn = '1 / -1';
          nameWrap.innerHTML = `<label>ویرایش نام زبان‌آموز:</label>`;
          const nameInp = document.createElement('input');
          nameInp.value = st.fullName || '';
          nameInp.oninput = (e) => {
            st.fullName = e.target.value;
            top.querySelector('.st-name').textContent = st.fullName || 'بدون نام';
            saveState();
          };
          nameWrap.appendChild(nameInp);
          grid.appendChild(nameWrap);
        }

        SCORE_COLS.forEach(c => {
          if (activeFilterCol !== 'all' && activeFilterCol !== c.key) return;

          const isSingle = (activeFilterCol === c.key);
          const box = document.createElement('div');
          box.className = 'score-input-box' + (isSingle ? ' highlight' : '');

          box.innerHTML = `<label style="font-weight:800;">${c.label} (حداکثر ${c.max}):</label>`;
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.inputMode = 'decimal';
          inp.className = 'num' + (isSingle ? ' single-mode-input' : '');
          inp.placeholder = '۰';
          inp.value = (st.scores[c.key] !== undefined && st.scores[c.key] !== 0) ? st.scores[c.key] : '';

          inp.oninput = (e) => {
            const raw = normalizeNumber(e.target.value);
            if (raw === '') {
              st.scores[c.key] = 0;
            } else {
              let val = parseFloat(raw);
              if (!isNaN(val)) {
                if (val > c.max) val = c.max;
                if (val < 0) val = 0;
                st.scores[c.key] = val;
              }
            }
            const totalEl = card.querySelector('.total');
            if (totalEl) totalEl.textContent = `${computeTotal(st.scores)} / ۴۰`;
            saveState();
          };

          box.appendChild(inp);
          grid.appendChild(box);
        });

        if (activeFilterCol === 'all' || activeFilterCol === 'notes') {
          const notesBox = document.createElement('div');
          if (activeFilterCol === 'all') notesBox.style.gridColumn = '1 / -1';
          notesBox.innerHTML = `<label>توضیحات و یادداشت:</label>`;
          const nInp = document.createElement('input');
          nInp.value = st.extras?.notes || '';
          nInp.placeholder = 'اختیاری...';
          nInp.oninput = (e) => {
            if (!st.extras) st.extras = {};
            st.extras.notes = e.target.value;
            saveState();
          };
          notesBox.appendChild(nInp);
          grid.appendChild(notesBox);
        }

        body.appendChild(grid);

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn pink';
        delBtn.style.cssText = 'padding:6px 12px; min-height:36px; font-size:12px; margin-top:6px; align-self:flex-start;';
        delBtn.textContent = 'حذف زبان‌آموز';
        delBtn.onclick = () => confirmDeleteStudent(st.id);
        body.appendChild(delBtn);

        card.appendChild(body);
        el.studentsList.appendChild(card);
      });

      updateHeaderSub();
    }

    function renderAll() {
      renderClasses();
      renderStudents();
    }
    // #endregion
    // ========================================================

    // ========================================================
    // #region 5. Class & Student Actions
    function handleCreateClass() {
      const name = el.modalClassNameInput.value.trim();
      if (!name) {
        toast('لطفاً نام کلاس را وارد کنید.');
        return;
      }

      const id = uid();
      state.classes.push({
        id,
        name,
        session: { dayOfWeek: '', sessionNo: '1', dateJalali: jalaliToday() },
        students: []
      });
      state.selectedClassId = id;
      saveState();
      renderAll();

      closeAddClassModal();
      toast('کلاس جدید ایجاد شد.');
    }

    function addStudent() {
      const cls = getSelectedClass();
      if (!cls) return;
      const name = (el.newStudentName.value || '').trim();
      if (!name) {
        toast('لطفاً نام زبان‌آموز را وارد کنید.');
        return;
      }
      const scores = {};
      SCORE_COLS.forEach(c => scores[c.key] = 0);

      cls.students.push({
        id: uid(),
        fullName: name,
        scores,
        extras: { notes: '' }
      });

      el.newStudentName.value = '';
      saveState();
      renderStudents();
      toast('زبان‌آموز اضافه شد.');
    }

    function confirmDeleteStudent(id) {
      const cls = getSelectedClass();
      if (!confirm('آیا از حذف این زبان‌آموز مطمئن هستید؟')) return;
      cls.students = cls.students.filter(s => s.id !== id);
      saveState();
      renderStudents();
      toast('زبان‌آموز حذف شد.');
    }
    // #endregion
    // ========================================================

    // ========================================================
    // #region 6. Export & Backup Handlers
    function buildExportDom(cls) {
      const stage = el.exportStage;
      stage.innerHTML = '';

      const title = document.createElement('div');
      title.className = 'export-title';
      title.textContent = 'جدول ارزشیابی و فعالیت کلاسی';
      stage.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'export-meta';
      meta.innerHTML = `
        <div class="item"><b>کلاس:</b> ${cls.name || ''}</div>
        <div class="item"><b>روز:</b> ${cls.session?.dayOfWeek || ''}</div>
        <div class="item"><b>جلسه:</b> ${cls.session?.sessionNo || ''}</div>
        <div class="item"><b>تاریخ:</b> ${cls.session?.dateJalali || ''}</div>
      `;
      stage.appendChild(meta);

      const table = document.createElement('table');
      table.className = 'export-table';

      let headers = ['ردیف', 'نام و نام خانوادگی'];
      SCORE_COLS.forEach(c => headers.push(`${c.label} (${c.max})`));
      headers.push('جمع (۴۰)', 'توضیحات');

      let tableHtml = '<thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';

      const students = cls.students || [];
      const rowCount = Math.max(12, students.length);

      for (let i = 0; i < rowCount; i++) {
        const s = students[i];
        tableHtml += '<tr>';
        tableHtml += `<td>${i + 1}</td>`;
        tableHtml += `<td class="name">${s ? (s.fullName || '') : ''}</td>`;

        SCORE_COLS.forEach(c => {
          const val = s ? s.scores[c.key] : '';
          tableHtml += `<td>${(val !== undefined && val !== 0) ? val : ''}</td>`;
        });

        tableHtml += `<td><b>${s ? computeTotal(s.scores) : ''}</b></td>`;
        tableHtml += `<td>${s ? (s.extras?.notes || '') : ''}</td>`;
        tableHtml += '</tr>';
      }

      tableHtml += '</tbody>';
      table.innerHTML = tableHtml;
      stage.appendChild(table);

      return stage;
    }

    async function exportPng() {
      const cls = getSelectedClass();
      if (!cls) return;

      const target = buildExportDom(cls);
      toast('در حال پردازش خروجی...');

      try {
        const canvas = await window.html2canvas(target, {
          backgroundColor: '#ffffff',
          scale: 2
        });
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        a.download = `فعالیت_کلاس_${cls.name || 'کلاس'}.png`;
        a.click();
        toast('خروجی PNG دانلود شد.');
      } catch (e) {
        toast('خطا در گرفتن خروجی تصویر.');
      } finally {
        target.innerHTML = '';
      }
    }
    // #endregion
    // ========================================================

    // ========================================================
    // #region 7. Event Listeners & Lifecycle
    function bindEvents() {
      el.tabs.forEach(t => t.onclick = () => showPage(t.dataset.page));
      el.quickStudents.onclick = () => showPage('page-students');
      el.quickExport.onclick = () => showPage('page-export');
      el.toastX.onclick = () => el.toast.style.display = 'none';

      el.colFilterSelect.onchange = (e) => {
        activeFilterCol = e.target.value;
        renderStudents();
      };

      el.classSelect.onchange = () => {
        state.selectedClassId = el.classSelect.value;
        saveState();
        renderAll();
      };

      // مدیریت مودال کلاس جدید
      el.btnAddClass.onclick = openAddClassModal;
      el.modalOverlay.onclick = closeAddClassModal;
      el.btnSubmitNewClass.onclick = handleCreateClass;
      el.modalClassNameInput.onkeydown = (e) => {
        if (e.key === 'Enter') handleCreateClass();
        if (e.key === 'Escape') closeAddClassModal();
      };

      el.btnDeleteClass.onclick = () => {
        if (state.classes.length <= 1) return toast('حداقل یک کلاس باید باقی بماند.');
        if (confirm('آیا این کلاس حذف شود؟ تمام نمرات آن پاک خواهند شد.')) {
          state.classes = state.classes.filter(c => c.id !== state.selectedClassId);
          state.selectedClassId = state.classes[0].id;
          saveState();
          renderAll();
        }
      };

      el.daySelect.onchange = (e) => {
        const cls = getSelectedClass();
        if (!cls.session) cls.session = {};
        cls.session.dayOfWeek = e.target.value;
        saveState();
        updateHeaderSub();
      };

      el.sessionNoInput.oninput = (e) => {
        const cls = getSelectedClass();
        if (!cls.session) cls.session = {};
        cls.session.sessionNo = e.target.value;
        saveState();
        updateHeaderSub();
      };

      el.dateInput.oninput = (e) => {
        const cls = getSelectedClass();
        if (!cls.session) cls.session = {};
        cls.session.dateJalali = e.target.value;
        saveState();
        updateHeaderSub();
      };

      el.btnAddStudent.onclick = addStudent;
      el.newStudentName.onkeydown = (e) => { if (e.key === 'Enter') addStudent(); };

      el.btnExportPng.onclick = exportPng;

      el.btnBackup.onclick = () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'grades_backup.json';
        a.click();
      };

      el.btnRestore.onclick = () => el.restoreFile.click();
      el.restoreFile.onchange = async () => {
        const file = el.restoreFile.files[0];
        if (file) {
          try {
            const txt = await file.text();
            state = sanitizeState(JSON.parse(txt));
            saveState();
            renderAll();
            toast('بازیابی اطلاعات انجام شد.');
          } catch (err) {
            toast('فایل معتبر نیست.');
          }
        }
      };

      el.btnWipe.onclick = () => {
        if (confirm('آیا مطمئن هستید؟ همه داده‌ها حذف خواهند شد.')) {
          localStorage.removeItem(STORAGE_KEY);
          state = makeFreshState();
          saveState();
          renderAll();
          toast('اطلاعات پاک شد.');
        }
      };
    }

    function init() {
      loadState();
      bindEvents();
      renderAll();
    }

    init();
    // #endregion
    // ========================================================

    // ========================================================
    // #region 8. Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/class-manager/sw.js?v=2').then(reg => {
        reg.update();
      });

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }
    // #endregion
    // ========================================================
  </script>

</body>
</html>
